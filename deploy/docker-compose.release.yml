# AI Intermediary release deployment. Preserve state mounts during updates.
name: ai-intermediary
services:
  ai-intermediary:
    image: __IMAGE__
    container_name: ai-intermediary
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Slightly longer than server.shutdown_grace so Node can finish cleanup.
    stop_grace_period: 3m
    ports:
      - "11435:11434"
    environment:
      CONFIG_PATH: /app/config.yml
      SETTINGS_PATH: /app/state/settings.json
      SETTINGS_RECOVERY_LISTEN: 0.0.0.0:11434
      LOG_LEVEL: info
    env_file:
      - ./secrets.env
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ai-intermediary-state:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  ai-intermediary-state:
