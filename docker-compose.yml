# AI Intermediary source deployment. Preserve state mounts during updates.
name: ai-intermediary
services:
  ai-intermediary:
    build:
      context: .
      args:
        INTERMEDIARY_BUILD: ${INTERMEDIARY_BUILD:-unknown}
    container_name: ai-intermediary
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Slightly longer than server.shutdown_grace so Node can finish cleanup.
    stop_grace_period: 3m
    ports:
      - "11435:11434"
    environment:
      CONFIG_PATH: /app/config.yml
      # Validated browser overrides persist in the existing named state volume.
      SETTINGS_PATH: /app/state/settings.json
      # Used only if normal configuration cannot start; host port 11435 still
      # reaches this container listener through the ports mapping below.
      SETTINGS_RECOVERY_LISTEN: 0.0.0.0:11434
      LOG_LEVEL: info
    env_file:
      - ./secrets.env
    volumes:
      # Base configuration is intentionally read-only. The settings page writes
      # only a validated override document under /app/state.
      - ./config.yml:/app/config.yml:ro
      - ai-intermediary-state:/app/state
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  ai-intermediary-state:
