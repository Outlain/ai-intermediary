name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check publication safety
        run: npm run check:public

      - name: Run tests
        run: npm test

      - name: Test isolated host helper with mocked hardware
        run: python3 -m unittest discover -s integrations/host -p 'test_*.py' -v

      - name: Test isolated ComfyUI execution bridge
        run: python3 -m unittest discover -s integrations/comfyui -p 'test_*.py' -v

      - name: Test administrator tooling with mocked Docker and video decoding
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

      - name: Fetch exact Frigate bridge test sources
        shell: bash
        run: |
          fixture_dir=$(mktemp -d)
          echo "FRIGATE_BRIDGE_SOURCE_FIXTURES=$fixture_dir" >> "$GITHUB_ENV"
          paths=(
            frigate/api/event.py
            frigate/api/review.py
            frigate/embeddings/__init__.py
            frigate/embeddings/maintainer.py
            frigate/data_processing/post/object_descriptions.py
            frigate/data_processing/post/review_descriptions.py
            frigate/genai/plugins/ollama.py
          )
          for i in "${!paths[@]}"; do
            curl --fail --silent --show-error --location --retry 3 --max-time 30 \
              "https://raw.githubusercontent.com/blakeblackshear/frigate/bb6c2e9/${paths[$i]}" \
              --output "$fixture_dir/$i.py"
          done

      - name: Test pinned Frigate bridge
        run: python3 -m unittest discover -s integrations/frigate -p 'test_*.py' -v

      - name: Build container
        run: docker build --tag ai-intermediary:ci .
