name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check publication safety
        run: npm run check:public

      - name: Run tests
        run: npm test

      - name: Test isolated host helper with mocked hardware
        run: python3 -m unittest discover -s integrations/host -p 'test_*.py' -v

      - name: Test isolated ComfyUI execution bridge
        run: python3 -m unittest discover -s integrations/comfyui -p 'test_*.py' -v

      - name: Test administrator tooling with mocked Docker and video decoding
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

      - name: Fetch exact Frigate bridge test sources
        shell: bash
        run: |
          fixture_dir=$(mktemp -d)
          echo "FRIGATE_BRIDGE_SOURCE_FIXTURES=$fixture_dir" >> "$GITHUB_ENV"
          python3 integrations/frigate/fetch_test_sources.py "$fixture_dir"

      - name: Test pinned Frigate bridge
        run: python3 -m unittest discover -s integrations/frigate -p 'test_*.py' -v

      - name: Build container
        run: docker build --tag ai-intermediary:ci .
