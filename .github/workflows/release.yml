name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and tests
        run: |
          npm run check:public
          npm test
          python3 -m unittest discover -s integrations/host -p 'test_*.py' -v
          python3 -m unittest discover -s integrations/comfyui -p 'test_*.py' -v
          python3 -m unittest discover -s test -p 'test_configure_comfy_auth.py' -v

      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish release image
        shell: bash
        run: |
          docker buildx create --name release-builder --use
          tags=(--tag "${{ steps.image.outputs.name }}:${GITHUB_REF_NAME}")
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags+=(--tag "${{ steps.image.outputs.name }}:latest")
          fi
          docker buildx build \
            --build-arg "INTERMEDIARY_BUILD=${GITHUB_SHA}" \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            "${tags[@]}" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            .

      - name: Package deployment bundle
        id: bundle
        shell: bash
        run: |
          bundle_name="ai-intermediary-${GITHUB_REF_NAME}-linux-amd64"
          sh scripts/package-release.sh "${{ steps.image.outputs.name }}" "$GITHUB_REF_NAME" dist
          echo "archive=dist/${bundle_name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${bundle_name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.bundle.outputs.archive }}" \
            "${{ steps.bundle.outputs.checksum }}" \
            --verify-tag \
            --generate-notes \
            --title "AI Intermediary ${GITHUB_REF_NAME}" \
            "${release_flags[@]}"
