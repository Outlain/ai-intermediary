# This is the operator-owned base configuration. The /settings page never
# rewrites this file; it stores validated overrides in /app/state/settings.json.
# Secrets remain in secrets.env and cannot be read or changed in the browser.
server:
  listen: 0.0.0.0:11434
  body_limit_bytes: 67108864
  # Keep this below Compose stop_grace_period so final cleanup can complete.
  shutdown_grace: 2m
  # Enable only behind a trusted reverse proxy; this permits X-Forwarded-For classification.
  trusted_proxy: false
  status_path: /status
  metrics_path: /metrics
  # Useful when a client cannot set X-Ollama-Client and source-IP classification is unsuitable.
  # Add matching port mappings to docker-compose.yml when these are enabled.
  dedicated_listeners: []
  # dedicated_listeners:
  #   - listen: 0.0.0.0:11435
  #     client: odysseus
  #   - listen: 0.0.0.0:11436
  #     client: frigate

ollama:
  # Supplied by secrets.env; never point this at the proxy itself.
  url: "${OLLAMA_URL:?Set OLLAMA_URL in secrets.env}"
  health_interval: 5s
  health_timeout: 3s
  # Hard runtime after dispatch; time spent in the proxy queue does not consume this budget.
  request_timeout: 30m

clients:
  default:
    enabled: true
    header_enabled: true
    listener_port: 0
    queue_while_paused: false
    priority: 50
    queue_limit: 20
    request_ttl: 10m
    max_wait: 5m
    overflow_policy: reject
    source_ips: []
    model_policy:
      idle_hold: 0s
      max_batch_requests: 1
      max_batch_time: 60s
      keep_alive: null

  odysseus:
    # Optional dedicated source port; also publish 11436:11436 in Compose.
    # listener_port: 11436
    priority: 100
    queue_limit: 10
    request_ttl: 30m
    # Interactive work may force a model switch immediately once the GPU is free.
    max_wait: 0s
    overflow_policy: reject
    # This is the fallback client, so Odysseus needs no stable Docker IP.
    source_ips: []
    # Applies to every model Odysseus requests; no model registration is required.
    model_policy:
      group: odysseus
      idle_hold: 1m
      max_batch_requests: 8
      max_batch_time: 90s
      keep_alive: 60s

  frigate:
    priority: 30
    queue_limit: 20
    request_ttl: 2m
    max_wait: 2m
    overflow_policy: drop_oldest
    # Set this CIDR in secrets.env, or send X-Ollama-Client: frigate.
    source_ips:
      - "${FRIGATE_SOURCE:-}"
    # Applies to every model Frigate requests; no model registration is required.
    model_policy:
      group: frigate
      idle_hold: 3s
      max_batch_requests: 10
      max_batch_time: 60s
      keep_alive: 2m
    # Optional newest-wins coalescing. Leave disabled until the actual Frigate payload/header is known.
    deduplication:
      enabled: false
      headers: []
      json_fields: []
      # Examples, only if present and stable in your Frigate requests:
      # headers: [X-Frigate-Event-ID]
      # json_fields: [event_id, camera]

# Optional exact-model overrides can be added here, but normal models never need registration.
models: {}

scheduler:
  # Strict mode: Odysseus always goes first; live Frigate waits for its idle hold.
  # Aging, max_wait and batch limits are used only by the optional balanced mode.
  mode: strict_priority
  # Raw active + pending body budget, not a process RSS limit. Leave container headroom.
  max_queue_bytes: 67108864
  # Exactly one GPU workload executes at a time across all backends.
  max_parallel_generations: 1
  priority_aging: false
  aging_interval: 10s
  aging_bonus: 5
  # Only Frigate needs a stable source match. Every unmatched request is Odysseus.
  default_client: odysseus
  # schedule = accept arbitrary model names using the detected client's policy.
  unknown_model_policy: schedule

circuit_breaker:
  failure_threshold: 3
  failure_window: 60s
  open_duration: 30s
  # hold preserves queued work while probes recover; reject_new returns 503 at admission.
  queue_behavior: hold

model_management:
  enabled: true
  serialize_with_inference: true

gpu_safety:
  # A proxy restart alone must not forget uncertain upstream work / GPU errors.
  state_path: /app/state/gpu-recovery.json
  # Once Ollama has accepted a request, finish reading it even if its caller disconnects.
  # This avoids aborting a ROCm model load and stranding a large GPU allocation.
  drain_active_disconnects: true
  # After the scheduler has chosen a different model, unload the prior model first.
  unload_on_model_switch: true
  unload_timeout: 30s
  # A single ROCm/GPU OOM latches the proxy into recovery_required instead of
  # dispatching more inference into a potentially poisoned driver state.
  recovery_on_oom: true
  error_body_limit_bytes: 65536

host_helper:
  # Optional Linux host service. Install integrations/host first and mount only
  # its group-restricted Unix socket directory; do not mount the Docker socket.
  enabled: false
  socket_path: /run/ai-intermediary-host/control.sock
  poll_interval: 5s
  request_timeout: 15s
  stale_after: 30s
  # Used only with enabled host monitoring.
  # Admission floors, not predictions of peak memory use. Live work is unchanged.
  memory_guard:
    enabled: true
    min_available_mb: 2048
    # Context rescue always requires RAM evidence, even if the guard above is off.
    rescue_min_available_mb: 4096
    max_pressure_full_percent: 10

auto_recovery:
  # Explicit opt-in after the host helper is installed and reports fresh data.
  # Restarts only ollama.service; never resets the GPU or reboots the host.
  enabled: false
  state_path: /app/state/auto-recovery.json
  check_interval: 5s
  restart_timeout: 90s
  verification_timeout: 60s
  cooldown: 5m
  window: 1h
  max_restarts: 2
  stable_samples: 3
  # Per-GPU baseline allowance after a verified service restart, not total VRAM.
  max_idle_vram_mb: 512

maintenance:
  # Administrative pause control is enabled by default; mutations require authentication.
  # One host-managed administrator credential protects all human controls.
  enabled: true
  auth_token: "${ADMIN_TOKEN:?Set ADMIN_TOKEN in secrets.env}"
  # Timed pauses longer than this are rejected; manual pauses have no expiry.
  max_pause: 168h
  # Persist pause state across intermediary container restarts.
  state_path: /app/state/maintenance.json

observability:
  # The dashboard and API use the existing intermediary listener and port.
  enabled: true
  ui_enabled: true
  # The same administrator credential is required for protected status reads.
  auth_token: "${ADMIN_TOKEN:?Set ADMIN_TOKEN in secrets.env}"
  # History is held only in memory and is erased when the container restarts.
  history_limit: 100
  recent_events: 20
  max_event_clients: 10
  queue_items_limit: 50

frigate:
  # Enable via /settings after providing the API address and host-managed credentials.
  enabled: false
  url: "${FRIGATE_URL:-}"
  # Use none for an intentionally open trusted API; auto preserves existing setups.
  auth_mode: auto
  username: "${FRIGATE_USERNAME:-}"
  password: "${FRIGATE_PASSWORD:-}"
  auth_token: "${FRIGATE_AUTH_TOKEN:-}"
  verify_tls: true
  state_path: /app/state/frigate-backlog.json
  # Discover new candidates slowly; confirm saved results independently.
  poll_interval: 30s
  confirmation_interval: 2s
  # Metadata/media availability cleanup does not use the GPU.
  cleanup_interval: 1m
  cleanup_batch_size: 25
  live_grace: 2m
  retry_interval: 1m
  max_retry_interval: 5h
  # An attention flag does not stop automatic retries.
  attention_after: 24h
  request_timeout: 15s
  generation_timeout: 10m
  # With the pinned Frigate bridge: bounded completed attempts awaiting DB save.
  # This never permits concurrent GPU inference or concurrent native attempts.
  max_verifying: 4
  page_size: 100
  max_jobs: 10000
  # Completed/skipped metadata history; pending jobs have a separate limit above.
  history_limit: 1000
  # Opt-in, correlated catch-up only. Never infer a safe cap from VRAM size.
  # Requires the existing Frigate bridge and host_helper.enabled monitoring.
  context_rescue:
    enabled: false
    model: "" # Exact model tag independently tested on this GPU/Ollama setup.
    max_context: 0 # Set a tested maximum before enabling; 0 is deliberately unset.
    output_reserve: 2048
    safety_margin: 1024
# Optional AI backends and ComfyUI media are configured in Settings or YAML.
# See docs/AI_INTERMEDIARY.md before enabling. Omitting `backends` uses the
# Ollama URL above. Media stays disabled until host telemetry, the
# authenticated ComfyUI bridge, a media source/port and trusted nodes are ready.
media:
  enabled: false
